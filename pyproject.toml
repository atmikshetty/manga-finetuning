[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "manga-finetuning"
version = "0.1.0"
description = "Portable tools for lawful manga-style and character LoRA dataset preparation, training, and evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Manga Finetuning contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
panel = ["numpy>=1.26", "Pillow>=10.0", "torch>=2.2", "transformers>=4.45", "tqdm>=4.66"]
gpu = ["accelerate>=0.34", "bitsandbytes>=0.43", "safetensors>=0.4"]
eval = ["diffusers>=0.30", "numpy>=1.26", "Pillow>=10.0", "safetensors>=0.4", "torch>=2.2"]
dev = ["Pillow>=10.0", "pre-commit>=3.8", "ruff>=0.6"]

[project.scripts]
manga-prepare-dataset = "manga_finetuning.dataset:main"
manga-apply-trigger = "manga_finetuning.captions:main"
manga-extract-panels = "manga_finetuning.panels_cli:main"
manga-prepare-character = "manga_finetuning.character:main"
manga-eval-checkpoints = "manga_finetuning.evaluation:main"
manga-artifact-manifest = "manga_finetuning.manifests:artifact_main"
manga-run-manifest = "manga_finetuning.manifests:run_main"

[tool.hatch.build.targets.wheel]
packages = ["src/manga_finetuning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
