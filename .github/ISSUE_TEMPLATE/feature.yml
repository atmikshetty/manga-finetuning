name: Feature request
description: Propose a curated finetuning capability
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow problem, not only a preferred solution.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Explain testing, dependency, data-governance, and compatibility impact.
    validations:
      required: true
  - type: checkboxes
    id: curated
    attributes:
      label: Scope check
      options:
        - label: This does not add acquisition, scraping, generation-app, raw-data, or artifact-hosting scope.
          required: true
